<style>
/* Layout: cabeçalho de largura total com marca, coluna única de cartões brancos sobre degradê laranja claro, navegação inferior. Paleta do app original no Base44 (laranja e âmbar). */
:root{
  --bg:#fffaf5; --bg-grad:linear-gradient(135deg,#fff7ed 0%,#ffffff 50%,#fffbeb 100%);
  --surface:#ffffff; --surface-2:#fff7ed; --ink:#111827; --muted:#6b7280; --line:#ffedd5; --line-strong:#fed7aa;
  --accent:#f97316; --accent-2:#f59e0b; --accent-ink:#ffffff; --accent-text:#c2410c; --accent-soft:#fff7ed;
  --grad:linear-gradient(90deg,#f97316,#f59e0b); --btn-shadow:0 6px 16px -6px rgba(249,115,22,.6);
  --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#92400e; --danger:#dc2626; --ok:#15803d;
  --head-bg:rgba(255,255,255,.97); --nav-bg:rgba(255,255,255,.94);
  --shadow:0 1px 2px rgba(124,45,18,.05),0 10px 24px -14px rgba(249,115,22,.35);
  --f-display:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a120d; --bg-grad:linear-gradient(135deg,#1f1510 0%,#17100c 55%,#1c140c 100%);
  --surface:#251a14; --surface-2:#2e2018; --ink:#fbeee2; --muted:#b9a797; --line:#3a2a1f; --line-strong:#5a3d2a;
  --accent:#fb923c; --accent-2:#fbbf24; --accent-ink:#1a120d; --accent-text:#fdba74; --accent-soft:#3a2517;
  --grad:linear-gradient(90deg,#fb923c,#fbbf24); --btn-shadow:0 6px 16px -8px rgba(251,146,60,.5);
  --warn-bg:#33260f; --warn-line:#5a4318; --warn-ink:#fcd34d; --danger:#f87171; --ok:#86efac;
  --head-bg:rgba(26,18,13,.97); --nav-bg:rgba(37,26,20,.94);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a120d; --bg-grad:linear-gradient(135deg,#1f1510 0%,#17100c 55%,#1c140c 100%);
  --surface:#251a14; --surface-2:#2e2018; --ink:#fbeee2; --muted:#b9a797; --line:#3a2a1f; --line-strong:#5a3d2a;
  --accent:#fb923c; --accent-2:#fbbf24; --accent-ink:#1a120d; --accent-text:#fdba74; --accent-soft:#3a2517;
  --grad:linear-gradient(90deg,#fb923c,#fbbf24); --btn-shadow:0 6px 16px -8px rgba(251,146,60,.5);
  --warn-bg:#33260f; --warn-line:#5a4318; --warn-ink:#fcd34d; --danger:#f87171; --ok:#86efac;
  --head-bg:rgba(26,18,13,.97); --nav-bg:rgba(37,26,20,.94);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.hin{max-width:720px;margin:0 auto;padding:12px 0;display:flex;align-items:center;gap:12px}

.sub{color:var(--muted);margin:0 0 18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:11px 13px;min-width:0;min-height:44px}

button{font:inherit;cursor:pointer}
.btn{background:var(--grad);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;min-height:44px;font-weight:600;box-shadow:var(--btn-shadow)}

.chip.on{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:var(--btn-shadow)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rgrid{display:grid;gap:20px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.rcard h3{margin:0 0 10px;font-size:20px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:16px}
.rmeta span{display:inline-flex;align-items:center;gap:6px}
.rmeta .o{color:var(--accent)}.rmeta .a{color:var(--accent-2)}
.rmeta b{font-weight:600;color:var(--ink)}
.rbtns{display:flex;gap:8px}
.vbtn{flex:1;min-width:0;background:var(--grad);color:var(--accent-ink);border:0;border-radius:10px;min-height:44px;font-weight:600;box-shadow:var(--btn-shadow)}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--surface);color:var(--accent-text);border:1px solid var(--line-strong);border-radius:10px}
.ibtn .ic{width:18px;height:18px}
.ibtn.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.ibtn.del.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.delmsg{margin:10px 0 0;color:var(--danger);font-size:13px}
.ctr{text-align:center}
.search{position:relative;margin-bottom:20px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{padding-left:44px;min-height:52px;font-size:17px}
.count{text-align:center;color:var(--muted);font-size:14px;margin:26px 0 0}
.hbtn{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);color:var(--accent-text);flex:none}
.hbtn.on{background:var(--grad);color:var(--accent-ink);border-color:transparent}
.hbtn .ic{width:20px;height:20px}
.brand{flex:1;min-width:0}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.recipe{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px;color:var(--ink);box-shadow:var(--shadow)}
.recipe .name{font-weight:700;min-width:0;overflow-wrap:anywhere}

.pill{background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.g{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.tag.off{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:0 0 8px}
td{padding:10px 0;border-top:1px solid var(--line)}
td.r,th.r{text-align:right;padding-left:14px}
tfoot td{font-weight:700;color:var(--accent-text)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.line{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:center}
.x{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;color:var(--muted);height:44px;font-size:18px}
.mini{font-size:13px;color:var(--muted);margin:4px 0 12px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:9px 12px;font-size:13px;margin:10px 0 0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.switch{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;min-height:32px;font-size:12px;font-weight:600}
.switch.on{color:var(--ok);border-color:var(--ok)}
.ing-row{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;grid-template-areas:"n n x" "q u u";gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ing-row:last-child{border-bottom:0;padding-bottom:0}
.f-name{grid-area:n}.f-qty{grid-area:q}.f-unit{grid-area:u}.f-x{grid-area:x}
details summary{list-style-position:inside;cursor:pointer;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;min-height:54px;border-radius:12px}
nav.tabs a.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;max-width:90vw}
.toast[hidden]{display:none}
.pw{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.pwc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.pwc h2{font-size:22px}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 16px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}.dots i.on{background:var(--accent);width:22px;border-radius:6px}
.topbar{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.rback{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-strong);color:var(--accent-text);box-shadow:var(--shadow)}
.rback .ic{width:20px;height:20px}
.bk{font-weight:600;color:var(--accent-text)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}
.hrow h1{margin:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:var(--shadow)}

.badge{background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}

.scard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 14px}

.cpill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--line-strong);margin-right:6px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function fk(r){var k=r.ings.map(function(i){return norm(i.n)}).sort().join('|');return (r.ings.length&&k)?k:'id:'+r.id}
function compute(plan){
  var ents=[],missing=[];
  plan.prods.forEach(function(p){
    if(!p.id)p.id=uid('q');
    var s=byId(S.sweets,p.sweetId);var u=num(p.units);
    if(!s||!u)return;
    var r=byId(S.recipes,p.recipeId);
    if(!r){missing.push(s.name);return}
    ents.push({eid:p.id,r:r,g:u*s.w,l:s.name+' · '+fmtQ(u)+' un',n:s.name,u:u});
  });
  plan.direct.forEach(function(d){
    if(!d.id)d.id=uid('q');
    var g=num(d.grams);var r=byId(S.recipes,d.recipeId);
    if(!r||!g)return;
    ents.push({eid:d.id,r:r,g:g,l:d.label||'Direto',n:d.label||'Receita direta',u:0});
  });
  var byE={};ents.forEach(function(e){byE[e.eid]=e});
  var merges=(plan.merges||[]).filter(function(m){return m.ids.filter(function(x){return byE[x]}).length>1});
  var done={},recs=[];
  ents.forEach(function(e){
    if(done[e.eid])return;
    var m=null;merges.forEach(function(mm){if(!m&&mm.ids.indexOf(e.eid)>-1)m=mm});
    if(m){
      var mem=m.ids.filter(function(x){return byE[x]}).map(function(x){return byE[x]});
      mem.forEach(function(x){done[x.eid]=true});
      var base=byId(S.recipes,m.base)||mem[0].r;
      var g=mem.reduce(function(a,x){return a+x.g},0);
      recs.push({r:base,g:g,f:base.yield>0?g/base.yield:0,mid:m.id,eids:mem.map(function(x){return x.eid}),members:mem.map(function(x){return {r:x.r,g:x.g}}),parts:mem.map(function(x){return {l:x.l,g:x.g,n:x.n,u:x.u}})});
    }else{
      done[e.eid]=true;
      recs.push({r:e.r,g:e.g,f:e.r.yield>0?e.g/e.r.yield:0,eid:e.eid,parts:[{l:e.l,g:e.g,n:e.n,u:e.u}]});
    }
  });
  var shop={},noq=[];
  recs.forEach(function(x){
    if(!x.r.ings.length&&noq.indexOf(x.r.name)<0)noq.push(x.r.name);
    x.r.ings.forEach(function(i){var u=uOf(i);var k=norm(i.n)+'|'+u.fam;if(!shop[k])shop[k]={n:i.n,fam:u.fam,v:0};shop[k].v+=i.g*u.f*x.f});
  });
  var rk=function(f){return f==='g'?0:f==='ml'?1:2};
  var list=Object.keys(shop).map(function(k){return shop[k]}).sort(function(a,b){return (rk(a.fam)-rk(b.fam))||(b.v-a.v)});
  return {recs:recs,shop:list,missing:missing,noq:noq};
}
function recCard(x,canSel,same,match){
  var sel=!!x.eid&&!!ui.sel[x.eid];
  var f=edit(Math.round(x.f*100)/100)+'×';
  var h='<article class="rc'+(sel?' sel':'')+(x.mid?' mg':'')+'"><div class="top">';
  if(canSel&&!x.mid)h+='<button class="chk'+(sel?' on':'')+'" data-act="sel" data-id="'+x.eid+'" aria-pressed="'+sel+'" aria-label="Marcar '+esc(x.r.name)+' para juntar">'+ic('check')+'</button>';
  h+='<div style="flex:1;min-width:0"><h3>'+esc(x.r.name)+'</h3>'+(x.mid?'<span class="cpill c4" style="margin-top:6px">Receitas juntadas</span>':(same?'<span class="cpill c5" style="margin-top:6px">Recheio igual</span>':''))+'</div><div class="big">'+fmt(x.g)+' g<small>fator '+f+'</small></div></div>';
  if(x.mid&&x.members.some(function(m){return m.r.id!==x.r.id}))h+='<p class="src"><b>Junta:</b> '+x.members.map(function(m){return esc(m.r.name)+' ('+fmt(m.g)+' g)'}).join(' + ')+'. Os ingredientes seguem a receita "'+esc(x.r.name)+'".</p>';
  h+='<p class="src">'+x.parts.map(function(q){return esc(q.l)+' ('+fmt(q.g)+' g)'}).join(' · ')+'</p>';
  if(x.mid)h+='<div style="margin-top:10px"><button class="btn ghost sm" data-act="merge-undo" data-id="'+x.mid+'">Desfazer junção</button></div>';
  h+='<details><summary>Ingredientes ('+x.r.ings.length+')</summary>'+(x.r.ings.length?x.r.ings.map(function(i){return '<div class="irow"><span class="n">'+esc(i.n)+'</span><span class="q">'+esc(qtyText(i,x.f))+'</span></div>'}).join(''):'<p class="mini">Sem ingredientes cadastrados.</p>')+'</details></article>';
  return h;
}
function resultHtml(){
  var c=compute(ui.plan);
  if(!c.recs.length&&!c.missing.length)return '<section class="sec empty">Escolha um doce e informe as unidades para ver o que produzir.</section>';
  var h='';
  var free=c.recs.filter(function(x){return !x.mid});
  var cnt={};free.forEach(function(x){var k=fk(x.r);cnt[k]=(cnt[k]||0)+1});
  Object.keys(ui.sel).forEach(function(id){if(!free.some(function(x){return x.eid===id}))delete ui.sel[id]});
  var selRecs=free.filter(function(x){return ui.sel[x.eid]});
  var selKey=selRecs.length?fk(selRecs[0].r):'';
  var anyElig=Object.keys(cnt).some(function(k){return cnt[k]>1});
  if(c.recs.length){
    h+='<div class="sech" style="margin-top:6px">'+ic('chef')+'<h2>Produzir</h2><span class="badge">'+c.recs.length+'</span></div>';
    if(anyElig)h+='<p class="mini" style="margin-top:-6px">Receitas com o mesmo recheio têm a etiqueta verde. Marque a caixinha só das que quer juntar; as não marcadas continuam separadas.</p>';
    if(selRecs.length>1){
      var rids=[];selRecs.forEach(function(x){if(rids.indexOf(x.r.id)<0)rids.push(x.r.id)});
      if(rids.indexOf(ui.mbase)<0)ui.mbase=rids[0];
      h+='<div class="mbar"><p><b>'+selRecs.length+' receitas marcadas.</b></p>';
      if(rids.length>1&&ui.merging)h+='<p>Qual receita será a base? Os ingredientes dela serão usados para o total.</p><div class="chips" style="margin-bottom:12px">'+rids.map(function(id){return '<button class="chip'+(ui.mbase===id?' on':'')+'" data-act="merge-base" data-id="'+id+'">'+esc(byId(S.recipes,id).name)+'</button>'}).join('')+'</div><div class="two"><button class="vbtn" data-act="merge-ok">Juntar</button><button class="vbtn ghost" data-act="merge-cancel">Cancelar</button></div>';
      else if(rids.length>1)h+='<div class="two"><button class="vbtn" data-act="merge-open">'+ic('merge')+' Juntar receitas</button><button class="vbtn ghost" data-act="sel-clear">Limpar</button></div>';
      else h+='<div class="two"><button class="vbtn" data-act="merge-ok">'+ic('merge')+' Juntar receitas</button><button class="vbtn ghost" data-act="sel-clear">Limpar</button></div>';
      h+='</div>';
    }
    h+=c.recs.map(function(x){var k=fk(x.r);var same=!x.mid&&cnt[k]>1;return recCard(x,!x.mid&&same&&(!selKey||k===selKey),same)}).join('');
  }
  if(c.missing.length)h+='<p class="warn">Escolha a receita de: '+esc(c.missing.join(', '))+'.</p>';

function parseLines(text){
  var out=[];
  text.split('\n').forEach(function(l){
    l=l.trim();if(!l)return;
    var p=l.split(/[;\t]/),n='',q=null;
    if(p.length>=3){n=p[0].trim();q=parseQty(p[1]);var uu=unitKey(p[2]);if(q&&uu)q.u=uu}
    else if(p.length===2){n=p[0].trim();q=parseQty(p[1])}
    else{var m=l.match(/^(.*\S)\s+(\d+(?:[.,]\d+)?\s*[^\d\s].*)$/);if(m){n=m[1];q=parseQty(m[2])}}
    if(n&&q)out.push({n:n,g:String(Math.round(q.q*1000)/1000),u:q.u});
  });
  return out;
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset,i=+d.i;

    e.preventDefault();
    if(d.tab==='nova'&&ui.tab!=='nova'&&!guard('recipes'))return;
    if(d.tab==='receitas')ui.recipeId=null;
    if(d.tab==='nova'&&ui.tab!=='nova'){ui.editId=null;ui.draft=newDraft()}
    go(d.tab);return;
  }
  switch(a){
    case 'open':ui.recipeId=d.id;ui.factor=1;ui.confirm='';render();break;
    case 'back':ui.recipeId=null;render();break;
    case 'factor':ui.factor=+d.v;render();break;
    case 'copy-recipe':var r=byId(S.recipes,d.id);if(r)copy(scaledText(r),'Receita copiada');break;
    case 'edit':var r2=byId(S.recipes,d.id);if(r2){ui.editId=r2.id;ui.draft={name:r2.name,yield:String(r2.yield),ings:r2.ings.length?r2.ings.map(function(x){return {n:x.n,g:String(x.g),u:x.u||'g'}}):[{n:'',g:'',u:'g'}],paste:''};go('nova')}break;
    case 'del-recipe':
      if(ui.confirm==='del-recipe'+d.id){S.recipes=S.recipes.filter(function(x){return x.id!==d.id});S.plans.concat([ui.plan]).forEach(function(pl){pl.prods.forEach(function(p){if(p.recipeId===d.id)p.recipeId=''});pl.direct.forEach(function(x){if(x.recipeId===d.id)x.recipeId=''})});save();ui.recipeId=null;ui.confirm='';toast('Receita excluída')}
      else ui.confirm='del-recipe'+d.id;
      render();break;
    case 'd-add':ui.draft.ings.push({n:'',g:'',u:'g'});render();break;
    case 'd-del':ui.draft.ings.splice(i,1);if(!ui.draft.ings.length)ui.draft.ings.push({n:'',g:'',u:'g'});render();break;
    case 'd-parse':
      var parsed=parseLines(ui.draft.paste);
      if(!parsed.length){toast('Nenhuma linha reconhecida. Use ingrediente;quantidade;unidade');break}
      var base=ui.draft.ings.filter(function(x){return x.n.trim()});
      ui.draft.ings=base.concat(parsed);ui.draft.paste='';toast(parsed.length+' ingredientes adicionados');render();break;
    case 'd-cancel':ui.draft=newDraft();var back=ui.editId;ui.editId=null;if(back){ui.recipeId=back}go('receitas');break;
    case 'd-save':
      if(!ui.editId&&!guard('recipes'))break;
      var dr=ui.draft;var name=dr.name.trim();
      var ings=dr.ings.filter(function(x){return x.n.trim()}).map(function(x){return {n:x.n.trim(),g:num(x.g),u:x.u||'g'}});
      var y=num(dr.yield);if(!y)y=massSum({ings:ings});
      if(!name){toast('Informe o nome da receita');break}
      if(!(y>0)){toast('Informe o rendimento em gramas');break}
      var rec=ui.editId?byId(S.recipes,ui.editId):null;
      if(rec){rec.name=name;rec.yield=y;rec.ings=ings}
      else{rec={id:uid('r'),name:name,yield:y,ings:ings};S.recipes.push(rec)}
      save();ui.recipeId=rec.id;ui.factor=1;ui.editId=null;ui.draft=newDraft();toast('Receita salva');go('receitas');break;
    case 'cat':ui.cat=d.v;render();break;
    case 'se-new':if(!guard('sweets'))break;ui.sweetEdit={id:'',name:'',cat:ui.cat==='Todos'?'Bombom':ui.cat,w:'',active:true};render();break;
    case 'se-edit':var s1=byId(S.sweets,d.id);ui.sweetEdit={id:s1.id,name:s1.name,cat:s1.cat,w:String(s1.w),active:s1.active};ui.confirm='';render();break;
    case 'se-cancel':ui.sweetEdit=null;ui.confirm='';render();break;
    case 'se-toggle':var s2=byId(S.sweets,d.id);s2.active=!s2.active;save();render();break;
    case 'se-save':
      var e1=ui.sweetEdit;if(!e1.name.trim()){toast('Informe o nome do doce');break}
      if(!(num(e1.w)>0)){toast('Informe o peso unitário em gramas');break}
      if(!e1.id&&!guard('sweets'))break;
      var tgt=e1.id?byId(S.sweets,e1.id):null;
      if(tgt){tgt.name=e1.name.trim();tgt.cat=e1.cat;tgt.w=num(e1.w)}
      else S.sweets.push({id:uid('s'),name:e1.name.trim(),cat:e1.cat,w:num(e1.w),active:true});
      save();ui.sweetEdit=null;toast('Doce salvo');render();break;
    case 'se-del':
      if(ui.confirm==='se-del'){S.sweets=S.sweets.filter(function(x){return x.id!==ui.sweetEdit.id});ui.plan.prods.forEach(function(p){if(p.sweetId===ui.sweetEdit.id)p.sweetId=''});save();ui.sweetEdit=null;ui.confirm='';toast('Doce excluído')}
      else ui.confirm='se-del';
      render();break;
    case 'p-add':ui.plan.prods.unshift({sweetId:'',recipeId:'',units:''});render();break;
    case 'p-del':ui.plan.prods.splice(i,1);if(!ui.plan.prods.length)ui.plan.prods.push({sweetId:'',recipeId:'',units:''});render();break;
    case 'dr-add':ui.plan.direct.unshift({recipeId:'',grams:'',label:''});render();break;
    case 'dr-del':ui.plan.direct.splice(i,1);render();break;
    case 'copy-shop':copy(shopText(),'Lista copiada');break;
    case 'sel':
      if(ui.sel[d.id])delete ui.sel[d.id];
      else{var cr=compute(ui.plan).recs,mp={};cr.forEach(function(x){if(x.eid)mp[x.eid]=fk(x.r)});var k0=mp[d.id];Object.keys(ui.sel).forEach(function(o){if(mp[o]!==k0)delete ui.sel[o]});ui.sel[d.id]=true}
      ui.merging=false;updWeek();break;
    case 'sel-clear':ui.sel={};ui.merging=false;updWeek();break;
    case 'merge-open':ui.merging=true;updWeek();break;
    case 'merge-cancel':ui.merging=false;updWeek();break;
    case 'merge-base':ui.mbase=d.id;updWeek();break;
    case 'merge-ok':
      var mr=compute(ui.plan).recs.filter(function(x){return x.eid&&ui.sel[x.eid]});if(mr.length<2)break;
      var rr=mr.map(function(x){return x.r.id});
      if(!ui.plan.merges)ui.plan.merges=[];
      ui.plan.merges.push({id:uid('m'),ids:mr.map(function(x){return x.eid}),base:rr.indexOf(ui.mbase)>-1?ui.mbase:rr[0]});
      ui.sel={};ui.merging=false;toast('Receitas juntadas');render();break;
    case 'merge-undo':ui.plan.merges=(ui.plan.merges||[]).filter(function(m){return m.id!==d.id});toast('Junção desfeita');render();break;
    case 'rep-open':ui.report=true;render();break;
    case 'rep-close':ui.report=false;render();break;
    case 'rep-print':try{if(window.AndroidPrint&&AndroidPrint.print)AndroidPrint.print();else window.print()}catch(er){toast('Impressão indisponível aqui. Use Copiar texto.')}break;
    case 'rep-copy':copy(reportText(),'Relatório copiado');break;
    case 'rep-share':try{navigator.share({title:planTitle(),text:reportText()}).catch(function(){})}catch(er){copy(reportText(),'Relatório copiado')}break;
    case 'plan-save':
      var pl=JSON.parse(JSON.stringify(ui.plan));
      if(!pl.name.trim())pl.name='Semana '+new Date().toLocaleDateString('pt-BR');
      if(!pl.id&&!guard('plans'))break;
      if(pl.id){S.plans=S.plans.map(function(x){return x.id===pl.id?pl:x})}else{pl.id=uid('p');S.plans.unshift(pl)}
      ui.plan.id=pl.id;ui.plan.name=pl.name;save();toast('Planejamento salvo');render();break;
    case 'plan-new':if(!guard('plans'))break;ui.plan=newPlan();ui.sel={};ui.merging=false;ui.editing=true;render();break;
    case 'wz-next':wz++;showWelcome();break;
    case 'wz-skip':wzDone();break;
    case 'wz-start':wzDone();break;
    case 'wz-sample':loadSample();wzDone();toast('Exemplos adicionados. Você pode apagá-los quando quiser.');render();break;
    case 'steps-hide':lsSet('recipegram-steps','x');render();break;
    case 'wz-again':lsSet('recipegram-steps',null);wz=0;showWelcome();break;
    case 'buy':buy();break;
    case 'restore':restore();break;
    case 'pw-close':closePaywall();break;
    case 'adm-login':
      var pw=($('#adm-pw')||{}).value||'';
      if(sha256(pw)===ADMIN_HASH){ADM=true;lsSet('recipegram-adm','1');toast('Modo administrador ativado');render()}else toast('Senha incorreta');
      break;
    case 'adm-logout':ADM=false;lsSet('recipegram-adm',null);toast('Modo administrador desativado');render();break;
    case 'plan-close':ui.plan=newPlan();ui.sel={};ui.merging=false;ui.editing=false;ui.report=false;render();break;
    case 'plan-open':var op=byId(S.plans,d.id);ui.plan=JSON.parse(JSON.stringify(op));ui.editing=true;ui.sel={};ui.merging=false;if(!ui.plan.merges)ui.plan.merges=[];if(!ui.plan.prods.length)ui.plan.prods.push({sweetId:'',recipeId:'',units:''});render();break;
    case 'plan-del':
      if(ui.confirm==='del-plan'+d.id){S.plans=S.plans.filter(function(x){return x.id!==d.id});if(ui.plan.id===d.id)ui.plan.id='';save();ui.confirm='';toast('Planejamento excluído')}
      else ui.confirm='del-plan'+d.id;
      render();break;
    case 'exp-copy':copy(JSON.stringify(S),'Cópia de segurança copiada');break;
    case 'json-import':
      try{var j=JSON.parse($('#imp').value);if(!j||!j.recipes||!j.sweets)throw 0;if(!pro()&&(j.recipes.length>LIM.recipes||j.sweets.length>LIM.sweets||(j.plans||[]).length>LIM.plans)){showPaywall('');break}S=j;if(!S.plans)S.plans=[];save();ui.plan=newPlan();ui.editing=false;toast('Dados restaurados');render()}
      catch(err){toast('Texto inválido. Cole a cópia completa.')}
      break;
    case 'csv-import':
      var txt=$('#csv').value;var done={},cnt=0,miss=[];
      txt.split('\n').forEach(function(l){
        l=l.trim();if(!l)return;
        var p=l.split(/[;\t]/);if(p.length<3)return;
        var rn=p[0].trim(),inn=p[1].trim(),q=parseQty(p[2]);
        if(q&&p[3]){var uu=unitKey(p[3]);if(uu)q.u=uu}
        if(!rn||!inn||!q)return;
        var rr=null;S.recipes.forEach(function(x){if(norm(x.name)===norm(rn))rr=x});
        if(!rr){rr={id:uid('r'),name:rn,yield:0,ings:[]};S.recipes.push(rr);rr._new=true}
        if(!done[rr.id]){rr.ings=[];done[rr.id]=1;cnt++}
        rr.ings.push({n:inn,g:q.q,u:q.u});
      });
      S.recipes.forEach(function(r){if(done[r.id]){if(r._new||!(r.yield>0))r.yield=massSum(r);delete r._new}});
      if(!cnt){toast('Nenhuma linha válida. Use Receita;Ingrediente;Quantidade;Unidade');break}
      save();toast(cnt+' receitas atualizadas');render();break;
    case 'wipe':
      if(ui.confirm==='wipe'){S={recipes:[],sweets:[],plans:[]};save();ui.plan=newPlan();ui.editing=false;ui.confirm='';ui.recipeId=null;toast('Todos os dados foram apagados')}
      else ui.confirm='wipe';
      render();break;
    case 'reset':
      if(ui.confirm==='reset'){S=seed();save();ui.plan=newPlan();ui.editing=false;ui.confirm='';ui.recipeId=null;toast('Lista inicial restaurada')}
      else ui.confirm='reset';
      render();break;
  }
});

var h0=location.hash.slice(1);
ui.tab=TABS.indexOf(h0)>-1?h0:'receitas';
render();
window.__ready=true;initBilling();
if(needWelcome()){wz=0;showWelcome()}
})();
</script>
